[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-rag-workbench"
version = "2.0.0"
description = "Enterprise-oriented RAG evaluation and retrieval workbench"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.141,<0.142",
  "httpx>=0.28,<0.29",
  "pgvector>=0.5,<0.6",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6.0,<7",
  "PyYAML>=6.0,<7",
  "sentence-transformers>=5.1,<6",
  "SQLAlchemy>=2.0.52,<2.1",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "reportlab>=4.4,<5",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["integration: requires the Docker PostgreSQL service"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen experiment utilities and one-off export scripts are not the serving package.
# Product lint gate remains: src/, tests/, scripts/, apps/.
extend-exclude = [
  "export_audit.py",
  "rag_evaluation_audit_export",
  "data/experiments",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
